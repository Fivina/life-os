services:
  postgres:
    image: postgres:16-alpine
    container_name: life-os-postgres
    environment:
      POSTGRES_DB: life_os
      POSTGRES_USER: life_os
      POSTGRES_PASSWORD: life_os
    ports:
      - "5432:5432"
    volumes:
      - life-os-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_os -d life_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  life-os-postgres:
