{
  "name": "learning-coach",
  "version": "2.1.1",
  "description": "Learning trajectory, exam, course, and study-session assistance.",
  "assistant_roles": ["LEARNING_COACH"],
  "default_capability": "FAST",
  "max_capability": "REASONING",
  "allowed_tools": ["get_current_state", "get_current_plan", "get_plan_block_explanation", "get_learning_status", "get_exam_status", "report_state", "log_study_session", "create_course", "create_exam", "update_exam"],
  "read_scopes": ["state", "planning", "learning"],
  "write_scopes": ["state", "learning"],
  "memory_scopes": ["conversation-summary", "semantic-memory", "episodic-memory", "behavioral-patterns"],
  "max_tool_calls": 3,
  "max_iterations": 4,
  "confirmation_policy": "registry",
  "cost_class": "low"
}
